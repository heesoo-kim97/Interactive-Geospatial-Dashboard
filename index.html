<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.4.1/mapbox-gl.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <link href='https://api.mapbox.com/mapbox-gl-js/v1.7.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="./styles.css">
    <title>Gun Violence Map</title>
</head>
<body>
    <div class="full-container">
        <div class="container1 gray">
            Gun Violence In United States
        </div>
        <div class="container2 gray">
            <div class="control-title">Select Date Range</div>
            <input
                title="dateRange"
                type="text"
                name="daterange"
                value="01/01/2013 - 12/31/2018"
            />
        </div>
        <div class="container3 gray">
            <div id="map-container">
                <div id="tooltip"></div>
            </div>
        </div>
        <div class="container4 gray">
            <div class="metric-title">Total Incidents</div>
            <div id="total-incidents" class="metric-value">0</div>
        </div>
        <div class="container5 gray">
            <div class=""metric-title">Total Killed</div>
            <div id=""total-killed" class="metric-value">0</div>
        </div>
        <div class="container6 gray">
            <div class="metric-title">Total Injured</div>
            <div id="total-injured" class="metric-value">0</div>
        </div>
        <div class="container7 gray">
            <div class="metric-title">Visualization</div>
            <label>
                <input type="radio" name="layer" value="scatter" checked>
                Incidents
            </label>
            <label>
                <input type="radio" name="layer" value="heat">
                Density
            </label>
            <label>
                <input type="radio" name="layer" value="heat">
                3D Density
            </label>
        </div>
    </div>
    <script src="./gun.js"></script>
</body>
</html>
